<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44"/>
      <stop offset="100%" style="stop-color:#1f1f33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#333355" stroke-width="4"/>

  <!-- Remote body shape -->
  <rect x="156" y="80" width="200" height="352" rx="40" ry="40" fill="url(#padGrad)" filter="url(#innerShadow)"/>
  <rect x="156" y="80" width="200" height="352" rx="40" ry="40" fill="none" stroke="#3d3d5c" stroke-width="2"/>

  <!-- Touch pad (top area) -->
  <rect x="176" y="100" width="160" height="160" rx="20" ry="20" fill="#252538"/>
  <rect x="176" y="100" width="160" height="160" rx="20" ry="20" fill="none" stroke="#3d3d5c" stroke-width="1.5"/>

  <!-- Touch pad crosshair -->
  <line x1="256" y1="120" x2="256" y2="240" stroke="#3d3d5c" stroke-width="1" opacity="0.5"/>
  <line x1="196" y1="180" x2="316" y2="180" stroke="#3d3d5c" stroke-width="1" opacity="0.5"/>

  <!-- Glowing indicator dot on touch pad -->
  <circle cx="280" cy="155" r="12" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- D-pad area -->
  <g transform="translate(256, 320)">
    <!-- D-pad cross -->
    <rect x="-45" y="-15" width="90" height="30" rx="5" fill="url(#buttonGrad)"/>
    <rect x="-15" y="-45" width="30" height="90" rx="5" fill="url(#buttonGrad)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="#1a1a2e"/>
    <!-- Direction indicators -->
    <polygon points="0,-35 -8,-25 8,-25" fill="#667eea" opacity="0.8"/>
    <polygon points="0,35 -8,25 8,25" fill="#667eea" opacity="0.8"/>
    <polygon points="-35,0 -25,-8 -25,8" fill="#667eea" opacity="0.8"/>
    <polygon points="35,0 25,-8 25,8" fill="#667eea" opacity="0.8"/>
  </g>

  <!-- Menu button (left) -->
  <rect x="176" y="385" width="50" height="28" rx="6" fill="url(#buttonGrad)"/>
  <line x1="188" y1="399" x2="214" y2="399" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>

  <!-- Home button (right) -->
  <rect x="286" y="385" width="50" height="28" rx="6" fill="url(#buttonGrad)"/>
  <!-- TV icon -->
  <rect x="299" y="391" width="24" height="16" rx="2" fill="none" stroke="#667eea" stroke-width="2"/>
  <line x1="306" y1="407" x2="316" y2="407" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>

  <!-- Wireless signal waves (top right) -->
  <g transform="translate(380, 100)" opacity="0.7">
    <path d="M0,30 Q15,15 30,30" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M5,22 Q15,12 25,22" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M10,14 Q15,9 20,14" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
